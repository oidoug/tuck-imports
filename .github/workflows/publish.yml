name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Marketplace trusted publishing (vsce --oidc)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies --oidc
